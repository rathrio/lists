services:
  postgres:
    image: postgres:15-alpine
    restart: always
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: rathrio/lists:latest
    restart: always
    # build: .
    ports:
      - "3000:3000"
    volumes:
      - ./volumes/public/uploads:/lists/public/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
      SOLID_QUEUE_IN_PUMA: "true"

      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

      REDIS_HOST: redis

      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      MOVIEDB_API_KEY: ${MOVIEDB_API_KEY}
      DISCOGS_API_KEY: ${DISCOGS_API_KEY}
      DISCOGS_API_SECRET: ${DISCOGS_API_SECRET}
      EDAMAM_API_ID: ${EDAMAM_API_ID}
      EDAMAM_API_KEY: ${EDAMAM_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}

      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Tailnet IPs — dialled by the Rails process, which can't resolve
      # tailnet names (--accept-dns=false). JELLYFIN_WEB_URL is handed to the
      # browser instead, which needs the MagicDNS name.
      JELLYSEERR_HOST: http://100.112.176.48:5055
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY}
      JELLYFIN_HOST: http://100.123.18.96:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID}
      JELLYFIN_WEB_URL: https://jellyfin.tail2bbb4f.ts.net
      JELLYFIN_SERVER_ID: b873182bec604a2b9c33ccc9daaf0a52
      LISTS_SYNC_USER_ID: 1
      # Watch sync runs dry (log-only) until this is "true" — review the
      # first run's [JellyfinWatchSync] log lines before enabling.
      JELLYFIN_WATCH_SYNC_ENABLED: ${JELLYFIN_WATCH_SYNC_ENABLED}
